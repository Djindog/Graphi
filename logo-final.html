<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphi Logo Designer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #111827;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      color: #6b7280;
      text-align: center;
      margin-bottom: 40px;
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }
    .preview {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      position: sticky;
      top: 40px;
    }
    svg {
      width: 100%;
      max-width: 400px;
      height: auto;
    }
    .controls {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .control-group {
      margin-bottom: 32px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .control-label label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    .control-value {
      font-size: 14px;
      color: #2563EB;
      font-weight: 600;
      min-width: 60px;
      text-align: right;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #E5E7EB;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563EB;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563EB;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-export {
      background: #2563EB;
      color: white;
    }
    .btn-export:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-reset {
      background: #F3F4F6;
      color: #374151;
      border: 1px solid #E5E7EB;
    }
    .btn-reset:hover {
      background: #E5E7EB;
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .preview {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Graphi Logo Designer</h1>
    <div class="subtitle">Interactive tree structure logo builder</div>

    <div class="layout">
      <div class="preview">
        <svg viewBox="-50 -50 500 450" xmlns="http://www.w3.org/2000/svg" id="logoSvg">
          <!-- Left curve -->
          <path id="leftCurve" d="" stroke="#2563EB" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Right curve -->
          <path id="rightCurve" d="" stroke="#2563EB" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Root node -->
          <circle id="rootNode" cx="200" cy="0" r="0" fill="#2563EB"/>
          <!-- Left child -->
          <circle id="leftChild" cx="0" cy="0" r="0" fill="#2563EB"/>
          <!-- Right child -->
          <circle id="rightChild" cx="0" cy="0" r="0" fill="#2563EB"/>
        </svg>
      </div>

      <div class="controls">
        <div class="control-group">
          <div class="control-label">
            <label>Curve Exaggeration</label>
            <span class="control-value" id="curveValue">30</span>
          </div>
          <input type="range" id="curveSlider" min="0" max="150" value="30" step="1">
        </div>

        <div class="control-group">
          <div class="control-label">
            <label>Line Thickness</label>
            <span class="control-value" id="thicknessValue">4</span>
          </div>
          <input type="range" id="thicknessSlider" min="1" max="20" value="4" step="0.5">
        </div>

        <div class="control-group">
          <div class="control-label">
            <label>Tree Height</label>
            <span class="control-value" id="heightValue">140</span>
          </div>
          <input type="range" id="heightSlider" min="40" max="200" value="140" step="5">
        </div>

        <div class="control-group">
          <div class="control-label">
            <label>Tree Width</label>
            <span class="control-value" id="widthValue">100</span>
          </div>
          <input type="range" id="widthSlider" min="20" max="200" value="100" step="5">
        </div>

        <div class="button-group">
          <button class="btn-export" onclick="exportSVG()">Copy SVG</button>
          <button class="btn-reset" onclick="resetSliders()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const curveSlider = document.getElementById('curveSlider');
    const thicknessSlider = document.getElementById('thicknessSlider');
    const heightSlider = document.getElementById('heightSlider');
    const widthSlider = document.getElementById('widthSlider');

    const curveValue = document.getElementById('curveValue');
    const thicknessValue = document.getElementById('thicknessValue');
    const heightValue = document.getElementById('heightValue');
    const widthValue = document.getElementById('widthValue');

    const leftCurve = document.getElementById('leftCurve');
    const rightCurve = document.getElementById('rightCurve');
    const rootNode = document.getElementById('rootNode');
    const leftChild = document.getElementById('leftChild');
    const rightChild = document.getElementById('rightChild');

    function updateLogo() {
      const curve = parseInt(curveSlider.value);
      const thickness = parseFloat(thicknessSlider.value);
      const height = parseInt(heightSlider.value);
      const width = parseInt(widthSlider.value);

      // Update values display
      curveValue.textContent = curve;
      thicknessValue.textContent = thickness.toFixed(1);
      heightValue.textContent = height;
      widthValue.textContent = width;

      // Calculate positions (centered in viewBox)
      const rootX = 200;
      const rootY = 80;
      const leftX = 200 - width / 2;
      const rightX = 200 + width / 2;
      const childY = rootY + height;

      // Update nodes
      rootNode.setAttribute('cx', rootX);
      rootNode.setAttribute('cy', rootY);
      rootNode.setAttribute('r', thickness * 1.5);

      leftChild.setAttribute('cx', leftX);
      leftChild.setAttribute('cy', childY);
      leftChild.setAttribute('r', thickness * 1.2);

      rightChild.setAttribute('cx', rightX);
      rightChild.setAttribute('cy', childY);
      rightChild.setAttribute('r', thickness * 1.2);

      // Calculate control point offset (curve exaggeration)
      const controlOffset = curve;

      // Create paths with cubic bezier curves
      const leftPath = `M ${rootX} ${rootY} C ${rootX - controlOffset} ${rootY + height * 0.5}, ${leftX - controlOffset * 0.5} ${childY - height * 0.3}, ${leftX} ${childY}`;
      const rightPath = `M ${rootX} ${rootY} C ${rootX + controlOffset} ${rootY + height * 0.5}, ${rightX + controlOffset * 0.5} ${childY - height * 0.3}, ${rightX} ${childY}`;

      leftCurve.setAttribute('d', leftPath);
      leftCurve.setAttribute('stroke-width', thickness);

      rightCurve.setAttribute('d', rightPath);
      rightCurve.setAttribute('stroke-width', thickness);
    }

    function resetSliders() {
      curveSlider.value = 30;
      thicknessSlider.value = 4;
      heightSlider.value = 140;
      widthSlider.value = 100;
      updateLogo();
    }

    function exportSVG() {
      const svg = document.getElementById('logoSvg');
      const svgString = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);

      // Copy to clipboard
      navigator.clipboard.writeText(svgString).then(() => {
        alert('SVG copied to clipboard!');
      }).catch(() => {
        // Fallback: download
        const a = document.createElement('a');
        a.href = url;
        a.download = 'graphi-logo.svg';
        a.click();
      });
    }

    // Event listeners
    curveSlider.addEventListener('input', updateLogo);
    thicknessSlider.addEventListener('input', updateLogo);
    heightSlider.addEventListener('input', updateLogo);
    widthSlider.addEventListener('input', updateLogo);

    // Initial render
    updateLogo();
  </script>
</body>
</html>
