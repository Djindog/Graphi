<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphi — Polish Lab</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; background: #F5F6F8; color: #111827; overflow: hidden; }
  * { box-sizing: border-box; }
  @keyframes gspin { to { transform: rotate(360deg); } }
  @keyframes gtoast { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gnodein { from { transform: translateY(10px) scale(0.97); } to { transform: translateY(0) scale(1); } }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F0F2F5"/>
    <line x1="50" y1="34" x2="32" y2="58" stroke="#2563EB" stroke-width="2"/>
    <line x1="50" y1="34" x2="68" y2="58" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="36" y="24" width="28" height="14" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="20" y="58" width="24" height="13" rx="4" fill="#fff" stroke="#2563EB" stroke-width="2"/>
    <rect x="56" y="58" width="24" height="13" rx="4" fill="#fff" stroke="#D1D5DB" stroke-width="2"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
