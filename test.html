<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Three.js Template</title>
    <style>
        /* Remove default margins and hide scrollbars to make the canvas full screen */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- This will hold our 3D canvas -->
    <div id="canvas-container"></div>

    <!-- Import Three.js using ES Modules from a CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. CREATE THE SCENE (The 3D Space)
        const scene = new THREE.Scene();

        // 2. CREATE THE CAMERA (The Perspective/Eyes)
        // Fields: Field of View (75 deg), Aspect Ratio, Near plane, Far plane
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3; // Move the camera back slightly so we can look at the object

        // 3. CREATE THE RENDERER (The Drawing Engine)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Append the canvas element generated by Three.js to our HTML document
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. ADD LIGHTS (So we can see 3D shading)
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft overall background light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 3); // Sunlight-like light source
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 5. CREATE THE SHAPE (Geometry + Material = Mesh)
        const geometry = new THREE.BoxGeometry(1, 1, 1); // A basic 1x1x1 cube
        
        // MeshStandardMaterial reacts realistically to the directional light vectors
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x3b82f6, // Neon Blue color
            roughness: 0.2,  // Shiniest look
            metalness: 0.5 
        });
        
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube); // Place the cube at the origin (0,0,0) of our scene

        // 6. THE ANIMATION LOOP (Runs every frame, roughly 60+ times a second)
        function animate() {
            requestAnimationFrame(animate);

            // Incrementally rotate the cube on each frame update
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Render the updated scene from the perspective of our camera
            renderer.render(scene, camera);
        }

        // Start the infinite rendering cycle
        animate();

        // 7. HANDLE WINDOW RESIZING (Keep aspect ratios perfect when sizing browser window)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
